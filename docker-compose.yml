services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  user-service:
    build:
      context: .
      dockerfile: backend/user-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=8001
      - MONGODB_URI=mongodb://mongodb:27017/simplearn_auth
      - JWT_ACCESS_SECRET=access_secret
      - JWT_REFRESH_SECRET=refresh_secret
    depends_on:
      - mongodb

  academy-service:
    build:
      context: .
      dockerfile: backend/academy-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=production
      - PORT=8002
      - MONGODB_URI=mongodb://mongodb:27017/simplearn_academy
      - JWT_ACCESS_SECRET=access_secret
    depends_on:
      - mongodb

volumes:
  mongodb_data:
